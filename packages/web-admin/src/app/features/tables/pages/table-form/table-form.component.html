<div class="fade-in">
  <div class="page-header">
    <div class="header-back">
      <a [routerLink]="listUrl" class="back-link">
        <lucide-icon name="chevron-left" [size]="18"></lucide-icon>
      </a>
      <h1>{{ pageTitle }}</h1>
    </div>
  </div>

  @if (error()) {
    <div class="alert-error">{{ error() }}</div>
  }

  <form (ngSubmit)="onSubmit()" class="card form-card" novalidate>
    <div class="form-grid">
      <div class="form-group">
        <label for="number">Número de mesa</label>
        <input id="number" type="number" min="1" step="1" class="form-control" [(ngModel)]="form.number" name="number" required placeholder="1" />
        @if (fieldErrors().number) {
          <span class="field-error">{{ fieldErrors().number }}</span>
        }
      </div>

      <div class="form-group">
        <label for="capacity">Capacidad</label>
        <input id="capacity" type="number" min="1" step="1" class="form-control" [(ngModel)]="form.capacity" name="capacity" required placeholder="4" />
        @if (fieldErrors().capacity) {
          <span class="field-error">{{ fieldErrors().capacity }}</span>
        }
      </div>

      <div class="form-group form-full">
        <label for="description">Descripción (opcional)</label>
        <input id="description" type="text" class="form-control" [(ngModel)]="form.description" name="description" placeholder="Terraza junto a la ventana" />
      </div>
    </div>

    <div class="form-actions">
      <a [routerLink]="listUrl" class="btn btn-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary" [disabled]="loading()">
        @if (loading()) {
          Guardando...
        } @else {
          Guardar
        }
      </button>
    </div>
  </form>
</div>
